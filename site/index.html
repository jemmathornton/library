<!doctype html>
<html lang="en-GB" data-mode="light">
<head>
<meta charset="utf-8">
<!-- Content Security Policy (her decision, 22 Nov): the browser runs only the site's own code (no inline scripts or handlers, nothing
     from other sites). Pictures may also come from https: as the Add a book page shows the covers it looks up (Open Library, shops)
     before one is chosen and copied in; data: and blob: for the cover tools' pictures. Styles 'unsafe-inline' for the style="…"
     colours and sizes the pages are built with. Why https: and not a list of hosts (round 5): the looked-up covers' addresses come
     from other sites' pages (Waterstones' and Goodreads' own image hosts, which they change) and some redirect elsewhere (Open
     Library's covers to archive.org's numbered servers, Amazon's to its media hosts); the policy checks every redirect too, so a
     list would silently blank covers on the Add page whenever a shop moved its pictures. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jemma’s Library</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-16.png" sizes="16x16" type="image/png">
<link rel="icon" href="icon-24.png" sizes="24x24" type="image/png">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icon-48.png" sizes="48x48" type="image/png">
<link rel="icon" href="icon-64.png" sizes="64x64" type="image/png">
<link rel="icon" href="icon-96.png" sizes="96x96" type="image/png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3B2616" data-dark="#1C1610">
<!-- kept out of search engines and AI crawlers (her decision for all her sites, 20 Nov; the family rules) -->
<meta name="robots" content="noindex, noai, noimageai">
<!-- the family's shared code, one copy in Jemma's Journals for all her sites (her decision, 22 Nov: site/family there, see its README).
     mode.js: light by default, dark only once she presses Dark mode on any site (localStorage "jj-mode"; the Library's old
     "jemmas-library-mode" is moved over once), set here before the page is drawn so it never flashes. family.css: the footer's layout
     and the drawer's mechanics (the Library's own look is in site.css). family.js: the Dark mode button, the bar colour above,
     Back to top, footer line 1, the credits' dots and the Menu drawer (js/app.js starts it). js/family-path.js writes the three tags
     here (mode.js, family.css, then family.js deferred): from /family/, or from Jemma's Journals' site/family when opened as a file. -->
<script src="js/family-path.js?v=72cc6c9f"></script>
<link rel="stylesheet" href="site.css?v=6caded3d">
</head>
<body>
<a class="skip" href="#view" data-skip>Skip to the page</a>
<!-- phones and narrow windows (21 Nov, her ask; like Sim World's): a slim top bar, the sidebar opens over the page as a drawer -->
<div class="topbar"><button id="menuBtn" type="button" aria-controls="side" aria-expanded="false"><span id="menuIco"></span>Menu</button><a class="topbar-name" href="#home">Jemma’s <em>Library</em></a></div>
<div class="scrim" id="scrim"></div>
<aside class="side" id="side" aria-label="Library">
  <!-- Way back to Jemma’s Journals, her home site (her pick, option A, 20 Nov). HOME_SITE_URL: "/" because the sites will share
       one address (home at the root, the apps under it; on her PC the family server, port 8050). Opened straight from the folder,
       js/app.js points it at Jemma's Journals' page in the folder beside (round 3, 22 Nov). -->
  <a class="home-link" href="/">← Jemma’s Journals</a>
  <a class="brand" href="#home"><b>Jemma’s <em>Library</em></b><small>Every book on the shelves</small></a>

</aside>
<main id="main"><div class="wrap" id="view" tabindex="-1"></div>

     site/family, the ❦ between rules and the colours the Library's own): the name, line 1 (filled by family.js, the same words on every
     site), the Library's credits, then Back to top and Dark/Light mode (family.js fills their icons and words) -->
<footer class="foot jj-foot"><div class="foot-orn" aria-hidden="true"><span>❦</span></div><b class="jj-name">Jemma’s Library</b>
  <p data-jj-line1></p>

  <div class="jj-foot-links"><a href="#top" data-jj-top="#view" id="toTop"></a><button type="button" data-jj-mode id="modeBtn"></button></div></footer></main>

</body>
</html>
